services:
  postgres:
    image: postgres:18.6-alpine
    container_name: cartopt-postgres

    environment:
      POSTGRES_DB: cartopt
      POSTGRES_USER: cartopt
      POSTGRES_PASSWORD: cartopt

    ports:
      - "55432:5432"

    volumes:
      - cartopt-postgres-data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cartopt -d cartopt"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  cartopt-postgres-data:
